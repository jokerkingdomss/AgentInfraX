server:
  port: 3002
  servlet:
    context-path: /api

spring:
  application:
    name: agentinfra-control-plane

  datasource:
    url: jdbc:postgresql://localhost:5432/agentinfra?stringtype=unspecified
    username: agentinfra
    password: agentinfra
    driver-class-name: org.postgresql.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: input
      table-prefix: ""

netty-socket-io:
  hostname: 0.0.0.0
  port: 10065
  ping-interval: 25000
  ping-timeout: 60000
